# Built with (see infra/terraform/head.tf):
#   gcloud builds submit services/head --config services/head/cloudbuild.yaml \
#     --substitutions _IMAGE=<registry>/head:<tag> --service-account <builder> \
#     --gcs-source-staging-dir gs://project-soundstage-builds/source \
#     --project project-soundstage
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "$_IMAGE", "."]
images: ["$_IMAGE"]
options:
  logging: CLOUD_LOGGING_ONLY
